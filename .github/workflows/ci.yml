name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.302
      - run: dotnet restore SshWeave.slnx
      - run: dotnet build SshWeave.slnx --configuration Release --no-restore
      - run: dotnet test SshWeave.slnx --configuration Release --no-build
      - run: dotnet publish src/SshWeave/SshWeave.csproj --configuration Release --runtime linux-x64 --self-contained true --output artifacts/publish/linux-x64 -p:PublishAot=true

  native-aot-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.302
      - shell: pwsh
        run: ./scripts/publish.ps1 -RuntimeIdentifier win-x64
